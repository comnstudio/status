<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>comn.click status</title>
<meta name="description" content="Live status of the comn.click website, dashboard, owner app and editor bot.">
<meta name="theme-color" content="#1c1a17">
<link rel="icon" href="https://comn.click/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--ink:#1c1a17;--paper:#fafafa;--cream:#f7f3eb;--line:#e9e5dd;--muted:#6b6a67;--soft:#969594;
--orange:#ff6020;--ok:#0f9d58;--warn:#f59e0b;--bad:#e5484d;--none:#e7e3da;
--ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:'Plus Jakarta Sans',Inter,sans-serif}
a{color:inherit}
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid rgba(0,0,0,.05)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{height:34px;width:auto;display:block}
.brand span{font:600 14px Inter;color:var(--muted);padding-left:12px;border-left:1px solid var(--line)}
.pill-btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;text-decoration:none;font:600 14px Inter;padding:10px 18px;border-radius:999px;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.pill-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(28,26,23,.5)}
.hero{background:linear-gradient(180deg,#d4e2f6 0%,#f6e9dc 62%,var(--cream) 100%);padding:64px 0 48px;text-align:center;position:relative;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:9px;background:#fff;border-radius:999px;padding:8px 16px;font:500 13px Inter;box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(0,0,0,.25);min-height:34px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--soft);position:relative;flex:none;transition:background .5s var(--ease)}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:inherit;opacity:0}
.state-ok .dot{background:var(--ok)}.state-warn .dot{background:var(--warn)}.state-bad .dot{background:var(--bad)}
.state-ok .dot::after,.state-warn .dot::after,.state-bad .dot::after{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.45}100%{transform:scale(2.2);opacity:0}}
.hero h1{font-weight:800;font-size:clamp(38px,7.2vw,68px);line-height:1.02;letter-spacing:-.045em;margin:26px auto 0;max-width:15ch;min-height:1.04em}
.hero h1 .hl{background:linear-gradient(var(--orange),var(--orange)) 0 92%/0% 9px no-repeat;transition:background-size 1s .35s var(--ease)}
.hero.in h1 .hl{background-size:100% 9px}
.lead{max-width:540px;margin:20px auto 0;color:#55534f;font-size:17px;min-height:52px}
.meta{margin-top:28px;font-size:13px;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:8px;min-height:20px}
.meta button{all:unset;cursor:pointer;font:600 13px Inter;color:var(--ink);padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.7);transition:background .2s}
.meta button:hover{background:#fff}
.meta button.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.rv{opacity:0;transform:translateY(14px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.in .rv,.rv.in{opacity:1;transform:none}
.sec{padding:56px 0}
.eyebrow{font:600 12px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.sec h2{font-weight:800;font-size:clamp(26px,4.2vw,38px);letter-spacing:-.035em;line-height:1.1;margin-top:10px}
.list{margin-top:28px;display:grid;gap:14px}
.card{background:#fff;border-radius:22px;padding:22px 24px 20px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 14px 34px -22px rgba(60,40,20,.35);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.card:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(0,0,0,.03),0 22px 40px -22px rgba(60,40,20,.45)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.name{display:flex;align-items:center;gap:10px;font:700 17px 'Plus Jakarta Sans';letter-spacing:-.02em;min-width:0}
.name span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font:600 12px Inter;padding:5px 11px;border-radius:999px;white-space:nowrap;transition:background .4s,color .4s}
.tag.up{background:#e6f6ed;color:#0b7a43}.tag.degraded{background:#fff3da;color:#9a6200}.tag.down{background:#fde8e9;color:#b4232a}
.strip{display:grid;grid-template-columns:repeat(90,1fr);gap:2px;margin-top:16px;height:34px}
.strip i{display:block;border-radius:3px;background:var(--none);transform-origin:bottom;transform:scaleY(.12);opacity:0;transition:transform .7s var(--ease),opacity .5s;transition-delay:calc(var(--i)*7ms + var(--base,0ms));position:relative;cursor:default}
.card.in .strip i{transform:none;opacity:1}
.strip i.ok{background:var(--ok)}.strip i.warn{background:var(--warn)}.strip i.bad{background:var(--bad)}
.strip i:hover{filter:brightness(1.1)}
.strip i::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);background:var(--ink);color:#fff;font:500 12px Inter;padding:6px 10px;border-radius:9px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:5}
.strip i:hover::after{opacity:1;transform:translate(-50%,0)}
.strip i:nth-child(-n+8)::after{left:0;transform:translate(0,4px)}.strip i:nth-child(-n+8):hover::after{transform:none}
.strip i:nth-last-child(-n+8)::after{left:auto;right:0;transform:translate(0,4px)}.strip i:nth-last-child(-n+8):hover::after{transform:none}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:12.5px;color:var(--soft);flex-wrap:wrap}
.nums{display:flex;gap:18px;color:var(--muted)}
.nums b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.sk{border-radius:8px;background:linear-gradient(100deg,#efebe3 30%,#f8f5ee 50%,#efebe3 70%);background-size:220% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-220% 0}}
.skcard{height:132px;border-radius:22px}
.fade{animation:fadein .5s var(--ease) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dark{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.dark::before{content:"";position:absolute;right:-10%;top:-30%;width:70%;height:90%;background:radial-gradient(closest-side,rgba(255,96,32,.16),transparent);pointer-events:none}
.dark h2{color:#fff}
.dark .sub{color:#b8b4ad;margin-top:12px;max-width:520px}
.inc{margin-top:28px;display:grid;gap:12px;position:relative}
.ev{background:#262421;border:1px solid #302d29;border-radius:20px;padding:18px 22px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;transition:border-color .3s,transform .4s var(--ease)}
.ev:hover{border-color:#4a4540;transform:translateY(-1px)}
.ev .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#34302b;font-size:15px}
.ev.open .ic{background:rgba(229,72,77,.18)}.ev.done .ic{background:rgba(15,157,88,.18)}
.ev h3{font:700 15.5px 'Plus Jakarta Sans';letter-spacing:-.01em}
.ev p{font-size:13px;color:#a7a39b;margin-top:2px}
.ev .w{font-size:13px;color:#a7a39b;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{background:#262421;border:1px dashed #3a3631;border-radius:20px;padding:34px 24px;text-align:center;color:#b8b4ad}
.empty b{display:block;color:#fff;font:700 17px 'Plus Jakarta Sans';margin-bottom:4px}
footer{background:var(--ink);color:#8d8982;padding:30px 0 44px;font-size:13px;border-top:1px solid #2a2724}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer img{height:30px;width:auto;display:block}
footer a{color:#cfcac2;text-decoration:none}footer a:hover{color:#fff}
.alert{display:none;margin:0 0 26px;background:#fff;border-radius:18px;padding:16px 20px;font-size:14px;box-shadow:0 14px 34px -22px rgba(60,40,20,.35)}
.alert.show{display:block}
@media (max-width:640px){
.wrap{padding:0 16px}.hero{padding:44px 0 40px}.sec{padding:44px 0}
.brand span{display:none}.card{padding:18px 16px 16px;border-radius:20px}.strip{gap:1.5px;height:28px}
.ev{grid-template-columns:auto 1fr}.ev .w{grid-column:2;text-align:left}
.nums{gap:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.strip i{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
<a class="brand" href="https://comn.click/" aria-label="comn.click home"><img src="https://comn.click/assets/comn-click-logomark-dark.svg" alt="comn.click" width="62" height="34"><span>Status</span></a>
<a class="pill-btn" href="https://comn.click/">Back to comn.click</a>
</div></header>
<section class="hero" id="hero"><div class="wrap">
<div class="chip rv" style="--d:.05s"><span class="dot"></span><span id="chipText">Checking…</span></div>
<h1 class="rv" style="--d:.12s" id="headline"><span class="sk" style="display:inline-block;width:72%;height:.9em;vertical-align:middle"></span></h1>
<p class="lead rv" style="--d:.2s" id="lead"></p>
<div class="meta rv" style="--d:.28s"><span id="updated">&nbsp;</span><button id="refresh" type="button" aria-label="Refresh now"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>Refresh</button></div>
</div></section>
<section class="sec"><div class="wrap">
<div class="alert" id="alert" role="status"></div>
<div class="eyebrow">Services</div>
<h2>Checked every five minutes.</h2>
<div class="list" id="list" aria-live="polite">
<div class="sk skcard"></div><div class="sk skcard"></div><div class="sk skcard"></div><div class="sk skcard"></div>
</div>
</div></section>
<section class="sec dark"><div class="wrap">
<div class="eyebrow">Incidents</div>
<h2>When something goes wrong, you will see it here first.</h2>
<p class="sub">Every outage is logged with when it started and how long it lasted.</p>
<div class="inc" id="inc"><div class="sk" style="height:76px;border-radius:20px;background:#2a2723"></div></div>
</div></section>
<footer><div class="wrap">
<div style="display:flex;align-items:center;gap:14px"><img src="https://comn.click/assets/comn-click-logomark.svg" alt="comn.click" width="62" height="34"><span>A ComnStudio product</span></div>
<div><a href="https://help.comn.click/">Help guides</a> &nbsp;·&nbsp; <a href="https://comn.click/">comn.click</a></div>
</div></footer>
<script>
(function(){
var REPO='comnstudio/status',RAW='https://raw.githubusercontent.com/'+REPO+'/master/';
var SINCE='2026-10-22';
var DAYS=90,TICK=60000;
var $=function(s){return document.querySelector(s)};
var hero=$('#hero'),listEl=$('#list'),incEl=$('#inc'),first=true,lastAt=0;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ago(ms){var s=Math.max(0,Math.round(ms/1000));if(s<45)return 'just now';var m=Math.round(s/60);if(m<60)return m+' min ago';var h=Math.round(m/60);if(h<48)return h+' h ago';return Math.round(h/24)+' days ago'}
function dur(min){if(min<1)return 'under a minute';if(min<60)return Math.round(min)+' min';var h=Math.floor(min/60),m=Math.round(min%60);return h+' h'+(m?' '+m+' min':'')}
function day(d){return d.toISOString().slice(0,10)}
function pretty(iso){var d=new Date(iso+'T00:00:00Z');return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})}
function label(st){return st==='up'?'Operational':st==='down'?'Down':'Degraded'}
function overall(sites){
var down=sites.filter(function(s){return s.status==='down'}).length,deg=sites.filter(function(s){return s.status==='degraded'}).length;
if(!down&&!deg)return{k:'ok',chip:'All systems operational',h:'All systems <span class="hl">operational.</span>',p:'Your pages, dashboard, owner app and editor bot are all responding normally.'};
if(down===sites.length)return{k:'bad',chip:'Major outage',h:'We are <span class="hl">down.</span>',p:'Everything is unreachable right now. We are on it and this page updates as soon as that changes.'};
if(down)return{k:'bad',chip:'Partial outage',h:'Some things are <span class="hl">down.</span>',p:'Part of comn.click is not responding. The services affected are marked below.'};
return{k:'warn',chip:'Degraded performance',h:'Running <span class="hl">slower.</span>',p:'Everything is up, but some services are responding more slowly than usual.'};
}
function strip(site){
var mins=site.dailyMinutesDown||{},now=new Date(),out='';
for(var i=DAYS-1;i>=0;i--){
var d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()-i)),k=day(d),cls='',tip;
if(k<SINCE){tip=pretty(k)+' · no data'}
else{var m=mins[k]||0;if(m===0){cls='ok';tip=pretty(k)+' · no downtime'}else if(m<15){cls='warn';tip=pretty(k)+' · '+dur(m)+' down'}else{cls='bad';tip=pretty(k)+' · '+dur(m)+' down'}}
out+='<i class="'+cls+'" style="--i:'+(DAYS-1-i)+'" data-tip="'+esc(tip)+'"></i>';
}
return out;
}
function renderList(sites){
var html='';
sites.forEach(function(s,i){
html+='<article class="card rv" style="--d:'+(i*.06)+'s" data-slug="'+esc(s.slug)+'">'
+'<div class="row"><div class="name"><span class="t">'+esc(s.name)+'</span></div><span class="tag '+esc(s.status)+'">'+label(s.status)+'</span></div>'
+'<div class="strip" style="--base:'+(250+i*70)+'ms">'+strip(s)+'</div>'
+'<div class="foot"><span>'+DAYS+' days ago</span><span class="nums"><span><b>'+esc(s.uptimeMonth||s.uptime)+'</b> uptime (30 d)</span><span><b>'+Math.round(s.time||0)+' ms</b> response</span></span><span>Today</span></div></article>';
});
listEl.innerHTML=html;
requestAnimationFrame(function(){requestAnimationFrame(function(){listEl.querySelectorAll('.card').forEach(function(c){c.classList.add('in')})})});
}
function patchList(sites){
sites.forEach(function(s){
var c=listEl.querySelector('[data-slug="'+s.slug+'"]');if(!c)return;
var t=c.querySelector('.tag');t.className='tag '+s.status;t.textContent=label(s.status);
var n=c.querySelectorAll('.nums b');if(n[0])n[0].textContent=s.uptimeMonth||s.uptime;if(n[1])n[1].textContent=Math.round(s.time||0)+' ms';
var st=c.querySelector('.strip'),fresh=document.createElement('div');fresh.innerHTML=strip(s);
var a=st.children,b=fresh.children;for(var i=0;i<a.length;i++){if(a[i].className!==b[i].className)a[i].className=b[i].className;a[i].setAttribute('data-tip',b[i].getAttribute('data-tip'))}
});
}
function renderHero(o){
hero.className='hero state-'+o.k+(hero.classList.contains('in')?' in':'');
$('#chipText').textContent=o.chip;
$('#headline').innerHTML=o.h;$('#lead').textContent=o.p;
if(first){requestAnimationFrame(function(){requestAnimationFrame(function(){hero.classList.add('in')})})}
document.title=(o.k==='ok'?'✓ ':o.k==='bad'?'✕ ':'! ')+'comn.click status';
}
function renderInc(issues){
if(!issues.length){incEl.innerHTML='<div class="empty fade"><b>No incidents yet</b>Nothing has gone down since monitoring began.</div>';return}
incEl.innerHTML=issues.slice(0,12).map(function(x,i){
var open=x.state==='open',name=(x.title||'').replace(/^[^\w]+/,'').replace(/ (is|was) (down|degraded).*/i,'');
var start=new Date(x.created_at),end=x.closed_at?new Date(x.closed_at):null;
var when=start.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit',timeZone:'Asia/Kolkata'});
return '<div class="ev '+(open?'open':'done')+' rv" style="--d:'+(i*.05)+'s"><div class="ic">'+(open?'!':'✓')+'</div>'
+'<div><h3>'+esc(name||x.title)+(open?' is having problems':' had an outage')+'</h3><p>'+(open?'Still being fixed':'Resolved · lasted '+dur((end-start)/60000))+'</p></div><div class="w">'+when+' IST</div></div>';
}).join('');
requestAnimationFrame(function(){requestAnimationFrame(function(){incEl.querySelectorAll('.rv').forEach(function(e){e.classList.add('in')})})});
var openOnes=issues.filter(function(x){return x.state==='open'});
var al=$('#alert');if(openOnes.length){al.textContent='Investigating: '+openOnes.map(function(x){return (x.title||'').replace(/^[^\w]+/,'')}).join(' · ');al.classList.add('show')}else al.classList.remove('show');
}
function get(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r})}
function tickText(){if(lastAt)$('#updated').textContent='Last checked '+ago(Date.now()-lastAt)}
function load(manual){
var b=$('#refresh');if(manual)b.classList.add('spin');
var p1=get(RAW+'history/summary.json?'+(Date.now()/3e5|0)).then(function(r){return r.json()});
var p2=get('https://api.github.com/repos/'+REPO+'/issues?state=all&per_page=20&labels=status').then(function(r){return r.json()}).catch(function(){return null});
return Promise.all([p1,p2]).then(function(v){
var sites=v[0],issues=v[1];
renderHero(overall(sites));
if(first)renderList(sites);else patchList(sites);
if(issues)renderInc(issues);
return get(RAW+'history/'+sites[0].slug+'.yml?'+(Date.now()/3e4|0)).then(function(r){return r.text()}).then(function(t){var m=/lastUpdated:\s*(\S+)/.exec(t);lastAt=m?new Date(m[1]).getTime():Date.now()}).catch(function(){lastAt=Date.now()});
}).then(function(){first=false;tickText()}).catch(function(){
if(first){hero.className='hero state-warn in';$('#chipText').textContent='Status unavailable';$('#headline').innerHTML='Cannot load <span class="hl">status.</span>';$('#lead').textContent='This page could not reach its data. Your pages are not affected by this: try Refresh in a moment.';listEl.innerHTML='';incEl.innerHTML=''}
}).then(function(){b.classList.remove('spin')});
}
$('#refresh').addEventListener('click',function(){load(true)});
setInterval(function(){load(false)},TICK);setInterval(tickText,15000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load(false)});
load(false);
})();
</script>
</body>
</html>
